<div class="min-h-screen bg-base-100 text-base-content" [attr.data-theme]="theme()">
  <app-sidebar [sections]="sidebarSections" />
  <main class="demo-content">
    <button appButton variant="soft" type="button" (click)="toggleTheme()">Cambiar a tema {{ theme() === 'vasquez-dark' ? 'claro' : 'oscuro' }}</button>
    <router-outlet />
  </main>
</div>
